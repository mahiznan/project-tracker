<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Progress (mock v2)</title>
<style>
  :root { --text:#111; --muted:#8a8a8a; --line:#ececec; --done:#1f9d55; --prog:#2563eb; --pend:#b5b5b5; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--text); color-scheme: light;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 24px 64px; }

  .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .tools { display:flex; gap:2px; }
  .tools button { background:none; border:0; color:var(--muted); font:inherit; font-size:13px; cursor:pointer; padding:4px; line-height:0; }
  .tools button:hover { color: var(--text); }

  .task { border-top: 1px solid var(--line); }
  .task:last-child { border-bottom: 1px solid var(--line); }
  .head { display:flex; align-items:flex-start; gap:12px; width:100%;
          background:none; border:0; padding:10px 0; font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .title { font-size: 15px; line-height:1.3; font-weight: 550; }
  .dates { display:none; }
  .task.open .dates { display:block; }
  .dates { font-size: 12.5px; color: var(--muted); margin-top: 0; font-variant-numeric: tabular-nums; }
  .info { flex:1; min-width:0; }
  .capsule { margin-top:-2px; display:inline-flex; align-items:center; gap:7px; flex-shrink:0; width:120px; font-size:12px; font-weight:550; padding:3px 0 3px 12px; border-radius:999px; }
  .capsule svg { width:14px; height:14px; flex-shrink:0; }
  .capsule.completed { color:#15803d; background:#e6f5ec; }
  .capsule.in-progress { color:#1d4ed8; background:#e8effd; }
  .capsule.pending { color:#6b6b6b; background:#f1f1f1; }
  /* circle with plus (minus when open) */
  .plus { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--pend); position:relative; flex-shrink:0; margin-top:1px; }
  .plus::before, .plus::after { content:""; position:absolute; left:50%; top:50%; background:var(--muted); transform:translate(-50%,-50%); }
  .plus::before { width:8px; height:1.5px; } .plus::after { width:1.5px; height:8px; }
  .task.open .plus::after { display:none; }
  .head:hover .plus { border-color: var(--text); }
  .head:hover .title { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }

  .subs { display:none; padding: 0 0 10px 30px; }
  .task.open .subs { display:block; }
  .sub { display:flex; align-items:center; gap:12px; padding: 4px 0; background:none; border:0; width:100%;
         font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .sub .label { flex:1; font-size:13px; }
  .sub.completed .label { color: var(--muted); }
  .sub .state { font-size:12.5px; color: var(--muted); }
  /* status: icon + text share one color; fixed-width block keeps icons in a straight column */
  .sub { --c: var(--pend); }
  .sub.in-progress { --c: var(--prog); } .sub.completed { --c: var(--done); }
  .stat { display:flex; align-items:center; gap:7px; width:120px; padding-left:12px; flex-shrink:0; color:var(--c); font-size:11.5px; font-weight:550; }
  .stat svg { width:14px; height:14px; flex-shrink:0; }

  .foot { margin-top: 28px; font-size: 12px; color: #bbb; }
  /* sits centered on the bottom divider line, breaking it */
  .more { display:block; position:relative; margin:-9px auto 0; width:30px; height:18px; padding:0; border:0;
          background:#fff; color:var(--pend); cursor:pointer; line-height:0; }
  .more svg { vertical-align:middle; }
  .more:hover { color: var(--text); }
  .more[hidden] { display:none; }
  .act { display:block; margin:4px 0 0 auto; background:none; border:0; color:var(--muted); font:inherit; font-size:12px; cursor:pointer; padding:2px 0; }
  .act:hover { color:var(--text); }
  .arch { margin-top:48px; }
  .arch-head { display:flex; align-items:center; gap:6px; background:none; border:0; padding:0 0 10px; font:inherit; font-size:13px; font-weight:550; color:var(--muted); cursor:pointer; }
  .arch-head:hover { color:var(--text); }
  .arch-head svg { transition:transform .15s; }
  .arch.open .arch-head svg { transform:rotate(90deg); }
  .arch-head .n { font-weight:400; }
  #archList { display:none; }
  .arch.open #archList { display:block; }
  .arch .title { color:#555; }
  .empty { color:var(--pend); font-size:13px; padding:4px 0 8px; }
  @media (max-width: 520px) { main { padding-top: 40px; } }
</style>
</head>
<body>
<main>
  <div class="top"><h1>Tasks &amp; Progress</h1>
    <div class="tools">
      <button id="listAll"></button>
      <button id="toggleAll"></button>
    </div></div>
  <section id="list"></section>
  <button id="more" class="more" aria-label="Show next task"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5 6 6l3.5-3.5M2.5 6.5 6 10l3.5-3.5"/></svg></button>

  <section class="arch" id="arch">
    <button class="arch-head" id="archHead" aria-expanded="false">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>
      Archive <span class="n" id="archN"></span>
    </button>
    <div id="archList"></div>
  </section>
</main>

<script>
  const TODAY = new Date("2026-11-04");
  const data = { tasks: [
    { id:1, name:"Payments API migration", start:"2026-10-12", end:"2026-11-20", subtasks:[
      {name:"Audit existing endpoints",status:"completed"},{name:"Design new schema",status:"completed"},
      {name:"Implement v2 endpoints",status:"in-progress"},{name:"Load testing",status:"pending"},{name:"Cut-over plan",status:"pending"}]},
    { id:2, name:"Onboarding flow redesign", start:"2026-10-01", end:"2026-10-30", subtasks:[
      {name:"User interviews",status:"completed"},{name:"Prototype in Figma",status:"completed"},
      {name:"Build steps 1–3",status:"in-progress"},{name:"A/B test setup",status:"pending"}]},
    { id:3, name:"CI pipeline speed-up", start:"2026-09-15", end:"2026-10-15", subtasks:[
      {name:"Profile slow stages",status:"completed"},{name:"Enable build caching",status:"completed"},{name:"Parallelise test suites",status:"completed"}]},
    { id:4, name:"Q4 observability dashboards", start:"2026-11-09", end:"2026-12-04", subtasks:[
      {name:"Define SLOs",status:"pending"},{name:"Instrument services",status:"pending"},{name:"Build dashboards",status:"pending"}]},
    { id:5, name:"CI pipeline speed-up", archived:true, start:"2026-09-15", end:"2026-10-15", subtasks:[
      {name:"Profile slow stages",status:"completed"},{name:"Enable build caching",status:"completed"},{name:"Parallelise test suites",status:"completed"}]},
    { id:6, name:"Mobile app v1 rewrite", archived:true, start:"2026-06-01", end:"2026-09-30", subtasks:[
      {name:"Choose framework",status:"completed"},{name:"Auth screens",status:"in-progress"},{name:"Offline sync",status:"pending"}]},
    { id:7, name:"Vendor evaluation", archived:true, start:"2026-08-10", end:"2026-09-10", subtasks:[
      {name:"Shortlist vendors",status:"pending"},{name:"Run pilots",status:"pending"}]}
  ]};
  const active = () => data.tasks.filter(t=>!t.archived);
  const archived = () => data.tasks.filter(t=>t.archived);
  const LABEL = {"completed":"Completed","in-progress":"In progress","pending":"Pending"};
  const NEXT = {"pending":"in-progress","in-progress":"completed","completed":"pending"};
  const ICON = {
    "completed":   '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7.25" fill="currentColor"/><path d="M5 8.3l2.2 2.2L11 6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    "in-progress": '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7.25" stroke="currentColor" stroke-width="1.5"/><circle cx="4.9" cy="8" r="1.05" fill="currentColor"/><circle cx="8" cy="8" r="1.05" fill="currentColor"/><circle cx="11.1" cy="8" r="1.05" fill="currentColor"/></svg>',
    "pending":     '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7.25" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.6V8l2.3 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const SVG = p => `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`;
  const EXPAND_ICON = SVG("M4.5 6.5 8 3l3.5 3.5M4.5 9.5 8 13l3.5-3.5");
  const COLLAPSE_ICON = SVG("M4.5 3 8 6.5 11.5 3M4.5 13 8 9.5l3.5 3.5");
  const LIST_ICON = SVG("M3 4.5h10M3 8h10M3 11.5h10");
  const SINGLE_ICON = SVG("M3 8h10");
  const open = new Set();
  let shown = 1;
  const fmt = d => new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const fmtY = d => new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  const derive = t => { const a=t.subtasks.map(s=>s.status);
    return a.every(x=>x==="completed")?"completed":a.every(x=>x==="pending")?"pending":"in-progress"; };

  const allExpanded = () => shown>=active().length && active().every(t=>open.has(t.id));

  function taskEl(t){
    const st = derive(t);
    const div = document.createElement("article");
    div.className = "task "+(open.has(t.id)?"open":"");
    div.innerHTML = `
      <button class="head">
        <i class="plus"></i>
        <div class="info"><div class="title">${t.name}</div>
          <div class="dates">ETA: ${fmtY(t.end)}</div></div>
        <span class="capsule ${st}">${ICON[st]}${LABEL[st]}</span>
      </button>
      <div class="subs">${t.subtasks.map((s,i)=>`
        <button class="sub ${s.status}" data-i="${i}"><span class="label">${s.name}</span>
          <span class="stat">${ICON[s.status]}<span>${LABEL[s.status]}</span></span></button>`).join("")}
        <button class="act">${t.archived?"Restore":"Archive"}</button></div>`;
    div.querySelector(".head").onclick = ()=>{ open.has(t.id)?open.delete(t.id):open.add(t.id); render(); };
    div.querySelectorAll(".sub").forEach(b=>b.onclick=()=>{ const s=t.subtasks[b.dataset.i]; s.status=NEXT[s.status]; render(); });
    div.querySelector(".act").onclick = ()=>{ t.archived = !t.archived; open.delete(t.id); render(); };
    return div;
  }

  function render(){
    const T = active();
    shown = Math.min(Math.max(shown,1), Math.max(T.length,1));
    const list = document.getElementById("list"); list.innerHTML = "";
    T.slice(0, shown).forEach(t=>list.appendChild(taskEl(t)));

    const A = archived(), al = document.getElementById("archList"); al.innerHTML = "";
    A.forEach(t=>al.appendChild(taskEl(t)));
    if (!A.length) al.innerHTML = '<div class="empty">Nothing archived</div>';
    document.getElementById("archN").textContent = A.length ? "· "+A.length : "";

    const la = document.getElementById("listAll"), isAll = shown>=T.length;
    la.innerHTML = isAll ? SINGLE_ICON : LIST_ICON;
    la.title = la.ariaLabel = isAll ? "Show first task only" : "Show all tasks";
    const tg = document.getElementById("toggleAll"), ex = allExpanded();
    tg.innerHTML = ex ? COLLAPSE_ICON : EXPAND_ICON;
    tg.title = tg.ariaLabel = ex ? "Collapse all" : "Show all";
    document.getElementById("more").hidden = shown >= T.length;
  }
  document.getElementById("archHead").onclick=()=>{
    const el=document.getElementById("arch"); el.classList.toggle("open");
    document.getElementById("archHead").setAttribute("aria-expanded", el.classList.contains("open"));
  };
  document.getElementById("listAll").onclick=()=>{ shown = shown>=active().length ? 1 : active().length; open.clear(); render(); };
  document.getElementById("toggleAll").onclick=()=>{
    if (allExpanded()) { open.clear(); }
    else { shown=active().length; active().forEach(t=>open.add(t.id)); }
    render();
  };
  document.getElementById("more").onclick=()=>{ shown++; render(); };
  render();
</script>
</body>
</html>
