<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks &amp; Progress</title>
<script>try{const t=localStorage.theme;if(t)document.documentElement.dataset.theme=t}catch{}</script>
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#fff,#111112);--text:light-dark(#111,#ececec);--sub:light-dark(#555,#b5b5b5);--muted:light-dark(#8a8a8a,#8a8a8f);
  --line:light-dark(#ececec,#272729);--done:light-dark(#1f9d55,#4cc38a);--prog:light-dark(#2563eb,#6ea1f7);--pend:light-dark(#b5b5b5,#5d5d62);
  --c-done:light-dark(#15803d,#6fd3a0);--c-done-bg:light-dark(#e6f5ec,#16291f);--c-prog:light-dark(#1d4ed8,#8db6fa);--c-prog-bg:light-dark(#e8effd,#16213a);
  --c-pend:light-dark(#6b6b6b,#a0a0a6);--c-pend-bg:light-dark(#f1f1f1,#242426);--tick:light-dark(#fff,#111112)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:48px 24px 64px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);outline:0;padding:2px 0}
input:focus{border-color:var(--prog)}
::placeholder{color:var(--pend)}

.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
.tools{display:flex;gap:2px}
.tools button{color:var(--muted);padding:4px;line-height:0}
.tools button:hover{color:var(--text)}

.task{border-top:1px solid var(--line)}
.task:last-child{border-bottom:1px solid var(--line)}
.head{display:flex;align-items:flex-start;gap:12px;width:100%;padding:10px 0}
.info{flex:1;min-width:0}
.title{font-size:15px;line-height:1.3;font-weight:550}
.dates{font-size:12.5px;color:var(--muted)}
.head:hover .title{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}

.plus{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--pend);position:relative;flex-shrink:0;margin-top:1px}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;background:var(--muted);transform:translate(-50%,-50%)}
.plus::before{width:8px;height:1.5px}.plus::after{width:1.5px;height:8px}
.open .plus::after{display:none}
.head:hover .plus{border-color:var(--text)}

.capsule,.stat{display:flex;align-items:center;gap:7px;width:120px;flex-shrink:0;padding-left:12px;font-weight:550}
.capsule{margin-top:-2px;padding-top:3px;padding-bottom:3px;border-radius:999px;font-size:12px}
.stat{font-size:11.5px;color:var(--c)}
.capsule svg,.stat svg{width:14px;height:14px;flex-shrink:0}
.completed{--c:var(--done)}.in-progress{--c:var(--prog)}.pending{--c:var(--pend)}
.capsule.completed{color:var(--c-done);background:var(--c-done-bg)}
.capsule.in-progress{color:var(--c-prog);background:var(--c-prog-bg)}
.capsule.pending{color:var(--c-pend);background:var(--c-pend-bg)}

.subs{padding:0 0 10px 30px}
.sub{display:flex;align-items:center;gap:12px;width:100%;padding:4px 0}
.sub .label{flex:1;font-size:13px}
.sub.completed .label{color:var(--muted)}
.subnew input{width:100%;font-size:13px;margin-top:4px;border-color:transparent}
.subnew input:focus{border-color:var(--prog)}
.act{display:block;margin:4px 0 0 auto;color:var(--muted);font-size:12px;padding:2px 0}
.act:hover{color:var(--text)}

.newtask{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.newtask input[name=n]{flex:1;font-weight:550}
.newtask input[name=d]{font-size:13px;color:var(--muted)}

.more{display:block;position:relative;margin:-9px auto 0;width:30px;height:18px;background:var(--bg);color:var(--pend);line-height:0}
.more:hover{color:var(--text)}
.more[hidden]{display:none}

.arch{margin-top:48px}
.arch-head{display:flex;align-items:center;gap:6px;padding-bottom:10px;font-size:13px;font-weight:550;color:var(--muted)}
.arch-head:hover{color:var(--text)}
.arch-head svg{transition:transform .15s}
.arch.open .arch-head svg{transform:rotate(90deg)}
.arch-head span{font-weight:400}
.arch .title{color:var(--sub)}
.empty{color:var(--pend);font-size:13px}
@media(max-width:520px){main{padding-top:40px}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Tasks &amp; Progress</h1>
    <div class="tools">
      <button data-a="add" id="add" title="New task" aria-label="New task"></button>
      <button data-a="list" id="list" ></button>
      <button data-a="all" id="all"></button>
      <button data-a="theme" id="theme"></button>
    </div>
  </div>
  <section id="tasks"></section>
  <button class="more" data-a="more" id="more" aria-label="Show next task"></button>
  <section class="arch" id="arch">
    <button class="arch-head" data-a="arch"></button>
    <div id="archived"></div>
  </section>
</main>

<script>
const data = { tasks: [
  {id:1,name:"Payments API migration",start:"2026-10-12",end:"2026-11-20",subtasks:[
    {name:"Audit existing endpoints",status:"completed"},{name:"Design new schema",status:"completed"},
    {name:"Implement v2 endpoints",status:"in-progress"},{name:"Load testing",status:"pending"},{name:"Cut-over plan",status:"pending"}]},
  {id:2,name:"Onboarding flow redesign",start:"2026-10-01",end:"2026-10-30",subtasks:[
    {name:"User interviews",status:"completed"},{name:"Prototype in Figma",status:"completed"},
    {name:"Build steps 1–3",status:"in-progress"},{name:"A/B test setup",status:"pending"}]},
  {id:3,name:"Q4 observability dashboards",start:"2026-11-09",end:"2026-12-04",subtasks:[
    {name:"Define SLOs",status:"pending"},{name:"Instrument services",status:"pending"},{name:"Build dashboards",status:"pending"}]},
  {id:5,name:"CI pipeline speed-up",archived:true,start:"2026-09-15",end:"2026-10-15",subtasks:[
    {name:"Profile slow stages",status:"completed"},{name:"Enable build caching",status:"completed"},{name:"Parallelise test suites",status:"completed"}]},
  {id:6,name:"Mobile app v1 rewrite",archived:true,start:"2026-06-01",end:"2026-09-30",subtasks:[
    {name:"Choose framework",status:"completed"},{name:"Auth screens",status:"in-progress"},{name:"Offline sync",status:"pending"}]},
  {id:7,name:"Vendor evaluation",archived:true,start:"2026-08-10",end:"2026-09-10",subtasks:[
    {name:"Shortlist vendors",status:"pending"},{name:"Run pilots",status:"pending"}]}
]};

const $ = id => document.getElementById(id);
const LABEL = {completed:"Completed","in-progress":"In progress",pending:"Pending"};
const NEXT = {pending:"in-progress","in-progress":"completed",completed:"pending"};
const svg = (d, s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ring = '<circle cx="8" cy="8" r="7.25" stroke="currentColor" stroke-width="1.5"/>';
const ICON = {
  completed: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7.25" fill="currentColor"/><path d="M5 8.3l2.2 2.2L11 6" style="stroke:var(--tick)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  "in-progress": `<svg viewBox="0 0 16 16" fill="none">${ring}<g fill="currentColor"><circle cx="4.9" cy="8" r="1.05"/><circle cx="8" cy="8" r="1.05"/><circle cx="11.1" cy="8" r="1.05"/></g></svg>`,
  pending: `<svg viewBox="0 0 16 16" fill="none">${ring}<path d="M8 4.6V8l2.3 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};
const I = {
  add: svg('<path d="M8 3v10M3 8h10"/>'), all: svg('<path d="M4.5 6.5 8 3l3.5 3.5M4.5 9.5 8 13l3.5-3.5"/>'),
  none: svg('<path d="M4.5 3 8 6.5 11.5 3M4.5 13 8 9.5l3.5 3.5"/>'), list: svg('<path d="M3 4.5h10M3 8h10M3 11.5h10"/>'),
  one: svg('<path d="M3 8h10"/>'), more: svg('<path d="M2.5 2.5 6 6l3.5-3.5M2.5 6.5 6 10l3.5-3.5"/>', 12),
  moon: svg('<path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.5 4.5 0 0 0 6.5 6.5z"/>'),
  sun: svg('<circle cx="8" cy="8" r="2.8"/><path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M3.6 12.4l1-1M11.4 4.6l1-1"/>'),
  chev: svg('<path d="M6 4l4 4-4 4"/>', 12)
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const status = t => { const a = t.subtasks.map(s => s.status);
  return !a.length || a.every(x => x==="pending") ? "pending" : a.every(x => x==="completed") ? "completed" : "in-progress"; };

const dark = matchMedia("(prefers-color-scheme:dark)");
const isDark = () => (document.documentElement.dataset.theme || (dark.matches ? "dark" : "light")) === "dark";
const open = new Set();
let shown = 1, adding = false, archOpen = false, focus = null;
const active = () => data.tasks.filter(t => !t.archived);

const taskHTML = t => {
  const st = status(t), o = open.has(t.id);
  return `<article class="task${o?" open":""}" data-id="${t.id}">
    <button class="head" data-a="toggle"><i class="plus"></i>
      <div class="info"><div class="title">${esc(t.name)}</div>${o?`<div class="dates">ETA: ${fmt(t.end)}</div>`:""}</div>
      <span class="capsule ${st}">${ICON[st]}${LABEL[st]}</span></button>
    ${o?`<div class="subs">${t.subtasks.map((s,i)=>`<button class="sub ${s.status}" data-a="cycle" data-i="${i}"><span class="label">${esc(s.name)}</span><span class="stat">${ICON[s.status]}${LABEL[s.status]}</span></button>`).join("")}
      <form class="subnew"><input name="n" placeholder="Add subtask" autocomplete="off" required></form>
      <button class="act" data-a="archive">${t.archived?"Restore":"Archive"}</button></div>`:""}
  </article>`;
};

function render() {
  const T = active(), A = data.tasks.filter(t => t.archived);
  shown = Math.min(Math.max(shown, 1), Math.max(T.length, 1));
  const full = shown >= T.length, allOpen = full && T.every(t => open.has(t.id));
  $("tasks").innerHTML = (adding ? `<form class="newtask"><i class="plus"></i><input name="n" placeholder="New task" autocomplete="off" required><input name="d" type="date" required></form>` : "")
    + T.slice(0, shown).map(taskHTML).join("");
  $("archived").innerHTML = archOpen ? (A.map(taskHTML).join("") || '<div class="empty">Nothing archived</div>') : "";
  $("arch").classList.toggle("open", archOpen);
  document.querySelector(".arch-head").innerHTML = `${I.chev} Archive <span>${A.length ? "· " + A.length : ""}</span>`;
  $("add").innerHTML = I.add;
  $("list").innerHTML = full ? I.one : I.list;  $("list").title = full ? "Show first task only" : "Show all tasks";
  $("all").innerHTML = allOpen ? I.none : I.all; $("all").title = allOpen ? "Collapse all" : "Show all";
  $("theme").innerHTML = isDark() ? I.sun : I.moon; $("theme").title = isDark() ? "Light theme" : "Dark theme";
  $("more").innerHTML = I.more; $("more").hidden = full;
  if (focus) { document.querySelector(focus)?.focus(); focus = null; }
}

const find = el => data.tasks.find(t => t.id == el.closest(".task")?.dataset.id);

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const t = find(b), a = b.dataset.a;
  if (a === "toggle") open.has(t.id) ? open.delete(t.id) : open.add(t.id);
  else if (a === "cycle") t.subtasks[b.dataset.i].status = NEXT[t.subtasks[b.dataset.i].status];
  else if (a === "archive") { t.archived = !t.archived; open.delete(t.id); }
  else if (a === "more") shown++;
  else if (a === "list") { shown = shown >= active().length ? 1 : active().length; open.clear(); }
  else if (a === "all") { const T = active(), every = shown >= T.length && T.every(x => open.has(x.id));
    if (every) open.clear(); else { shown = T.length; T.forEach(x => open.add(x.id)); } }
  else if (a === "add") { adding = !adding; if (adding) focus = ".newtask input"; }
  else if (a === "arch") archOpen = !archOpen;
  else if (a === "theme") { const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; try { localStorage.theme = t } catch {} }
  render();
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, n = f.n.value.trim(); if (!n) return;
  if (f.classList.contains("newtask")) {
    const t = {id: Date.now(), name: n, start: new Date().toISOString().slice(0,10), end: f.d.value, subtasks: []};
    data.tasks.unshift(t); open.add(t.id); adding = false; shown = Math.max(shown, 1);
    focus = `[data-id="${t.id}"] .subnew input`;
  } else {
    const t = find(f); t.subtasks.push({name: n, status: "pending"});
    focus = `[data-id="${t.id}"] .subnew input`;
  }
  render();
});

document.addEventListener("keydown", e => { if (e.key === "Escape" && adding) { adding = false; render(); } });
dark.onchange = render;
render();
</script>
</body>
</html>
