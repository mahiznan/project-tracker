<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Progress (mock)</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #fff; --line: #e8e8e4; --text: #1c1c1a; --muted: #75756f;
    --done: #2f8f5b;   --done-bg: #e6f4ec;
    --prog: #2b6fd6;   --prog-bg: #e7effc;
    --pend: #7a7a74;   --pend-bg: #efefeb;
    --late: #c2412d;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1d1d1b; --line: #2d2d2a; --text: #ecece8; --muted: #8e8e87;
      --done: #5cc48a; --done-bg: #1b2e24;
      --prog: #6aa2f5; --prog-bg: #1a2638;
      --pend: #9a9a93; --pend-bg: #2a2a27;
      --late: #ee7a67;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 64px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; gap: 8px; align-items: center; }
  button.ghost { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px;
                 padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }
  .saved { font-size: 12px; color: var(--muted); }

  .summary { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; min-width: 110px; }
  .stat b { display: block; font-size: 20px; font-weight: 650; }
  .stat span { font-size: 12px; color: var(--muted); }

  .cols, .task-head { display: grid; grid-template-columns: 20px minmax(0,1fr) 92px 92px 70px 112px; gap: 12px; align-items: center; }
  .cols { padding: 0 16px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  .task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
  .task-head { padding: 14px 16px; cursor: pointer; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; }
  .task-head:hover { background: color-mix(in srgb, var(--line) 35%, transparent); }
  .chev { color: var(--muted); transition: transform .15s; font-size: 12px; }
  .task.open .chev { transform: rotate(90deg); }
  .name { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .date.late { color: var(--late); font-weight: 560; }
  .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .bar { height: 3px; background: var(--pend-bg); }
  .bar i { display: block; height: 100%; background: var(--done); transition: width .2s; }

  .subs { display: none; border-top: 1px solid var(--line); padding: 4px 16px 10px 48px; }
  .task.open .subs { display: block; }
  .sub-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line); gap: 12px; }
  .sub-row:last-child { border-bottom: 0; }
  .sub-row.completed .sub-name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 560; border: 0; cursor: default; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.completed { color: var(--done); background: var(--done-bg); }
  .pill.in-progress { color: var(--prog); background: var(--prog-bg); }
  .pill.pending { color: var(--pend); background: var(--pend-bg); }
  button.pill { cursor: pointer; font-family: inherit; }
  button.pill:hover { filter: brightness(.96); }

  .hint { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; }

  @media (max-width: 640px) {
    .cols { display: none; }
    .task-head { grid-template-columns: 20px 1fr auto; }
    .task-head .date, .task-head .count { display: none; }
    .subs { padding-left: 16px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Weekly progress</h1>
      <div class="sub" id="asof"></div>
    </div>
    <div class="actions">
      <span class="saved" id="saved">Saved to tasks.json</span>
      <button class="ghost" id="toggleAll">Expand all</button>
    </div>
  </header>

  <section class="summary" id="summary"></section>

  <div class="cols">
    <span></span><span>Task</span><span>Start</span><span>Planned end</span><span>Subtasks</span><span>Status</span>
  </div>
  <section id="list"></section>

  <p class="hint">MOCK · sample data · click a row to expand · click a subtask status to cycle it (this is the edit interaction)</p>
</main>

<script>
  // Sample data, same shape as the planned tasks.json
  const TODAY = new Date("2026-11-04");
  const data = { tasks: [
    { id: 1, name: "Payments API migration", start: "2026-10-12", end: "2026-11-20", status: "in-progress", subtasks: [
      { name: "Audit existing endpoints", status: "completed" },
      { name: "Design new schema", status: "completed" },
      { name: "Implement v2 endpoints", status: "in-progress" },
      { name: "Load testing", status: "pending" },
      { name: "Cut-over plan", status: "pending" } ]},
    { id: 2, name: "Onboarding flow redesign", start: "2026-10-01", end: "2026-10-30", status: "in-progress", subtasks: [
      { name: "User interviews", status: "completed" },
      { name: "Prototype in Figma", status: "completed" },
      { name: "Build step 1–3", status: "in-progress" },
      { name: "A/B test setup", status: "pending" } ]},
    { id: 3, name: "CI pipeline speed-up", start: "2026-09-15", end: "2026-10-15", status: "completed", subtasks: [
      { name: "Profile slow stages", status: "completed" },
      { name: "Enable build caching", status: "completed" },
      { name: "Parallelise test suites", status: "completed" } ]},
    { id: 4, name: "Q4 observability dashboards", start: "2026-11-09", end: "2026-12-04", status: "pending", subtasks: [
      { name: "Define SLOs", status: "pending" },
      { name: "Instrument services", status: "pending" },
      { name: "Build dashboards", status: "pending" } ]}
  ]};

  const LABEL = { "completed": "Completed", "in-progress": "In progress", "pending": "Pending" };
  const NEXT  = { "pending": "in-progress", "in-progress": "completed", "completed": "pending" };
  const open = new Set();
  const fmt = d => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };

  function render() {
    document.getElementById("asof").textContent =
      "As of " + TODAY.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    const t = data.tasks;
    const n = s => t.filter(x => x.status === s).length;
    document.getElementById("summary").innerHTML =
      [["Total", t.length], ["In progress", n("in-progress")], ["Completed", n("completed")], ["Pending", n("pending")]]
        .map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

    const list = document.getElementById("list");
    list.innerHTML = "";
    t.forEach(task => {
      const done = task.subtasks.filter(s => s.status === "completed").length;
      const pct = task.subtasks.length ? Math.round(done / task.subtasks.length * 100) : 0;
      const late = task.status !== "completed" && new Date(task.end) < TODAY;
      const card = el(`
        <article class="task ${open.has(task.id) ? "open" : ""}">
          <button class="task-head" aria-expanded="${open.has(task.id)}">
            <span class="chev">▶</span>
            <span class="name">${task.name}</span>
            <span class="date">${fmt(task.start)}</span>
            <span class="date ${late ? "late" : ""}" title="${late ? "Past planned end date" : ""}">${fmt(task.end)}</span>
            <span class="count">${done}/${task.subtasks.length}</span>
            <span><span class="pill ${task.status}">${LABEL[task.status]}</span></span>
          </button>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="subs">
            ${task.subtasks.map((s, i) => `
              <div class="sub-row ${s.status}">
                <span class="sub-name">${s.name}</span>
                <button class="pill ${s.status}" data-i="${i}">${LABEL[s.status]}</button>
              </div>`).join("")}
          </div>
        </article>`);
      card.querySelector(".task-head").onclick = () => { open.has(task.id) ? open.delete(task.id) : open.add(task.id); render(); };
      card.querySelectorAll("button.pill").forEach(b => b.onclick = () => {
        const s = task.subtasks[b.dataset.i]; s.status = NEXT[s.status];
        // Task status is derived from its subtasks
        const all = task.subtasks.map(x => x.status);
        task.status = all.every(x => x === "completed") ? "completed" : all.every(x => x === "pending") ? "pending" : "in-progress";
        const sv = document.getElementById("saved"); sv.textContent = "Saved just now"; render();
      });
      list.appendChild(card);
    });
    document.getElementById("toggleAll").textContent = open.size === t.length ? "Collapse all" : "Expand all";
  }

  document.getElementById("toggleAll").onclick = () => {
    open.size === data.tasks.length ? open.clear() : data.tasks.forEach(x => open.add(x.id));
    render();
  };
  render();
</script>
</body>
</html>
